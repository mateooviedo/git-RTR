<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>viandas fit</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body class="grid-contenedor">
    <header>
        <img src="img/b4132839ee2e902723bfa28e3341b80516526e25.png" alt="Logo de la empresa">
    </header>
    <nav class="nav">
        <ul>
            <li><button onclick="window.location.href='login.html'">Registro</button></li>
            <li><button onclick="window.location.href='dashboard.html'">Dashboard</button></li>
            <li><button onclick="window.location.href='clientes.html'">Clientes</button></li>
            <li><button onclick="window.location.href='pedidos.html'">Pedidos</button></li>
            <li><button onclick="window.location.href='menu.html'">menu</button></li>
            <li><button onclick="window.location.href='historial.html'">historial</button></li>
        </ul>
    </nav>
    <main class="main">

        <!-- Sección de selección y búsqueda de cliente -->
        <section>
            <h3>Seleccionar Cliente</h3>
            <div class="buscacliente">
                <input type="text" id="searchCliente" placeholder="Filtrar cliente por nombre o teléfono...">
            </div>
            <div id="contenedorClientes" style="max-height: 150px; overflow-y: auto; border: 1px solid #ccc; padding: 10px; margin-bottom: 20px;">
                <!-- Se cargan los clientes con radio buttons dinámicamente -->
            </div>
        </section>

        <!-- Sección de selección de menú y cantidades -->
        <section>
            <h3>Seleccionar Platos y Cantidades</h3>
            <table>
                <thead>
                    <tr>
                        <th>Seleccionar</th>
                        <th>Plato</th>
                        <th>Precio Unitario</th>
                        <th>Cantidad</th>
                    </tr>
                </thead>
                <tbody id="cuerpoTablaMenuPedidos">
                    <!-- Se cargan los platos del menú con checkbox y inputs de cantidad -->
                </tbody>
            </table>
        </section>

        <div style="margin-top: 15px; font-size: 1.2em; font-weight: bold;">
            Total General: $<span id="totalGeneralPedido">0.00</span>
        </div>

        <button class="agregar-nuevo" id="btnGuardarPedido" style="margin-top: 10px;">Guardar Pedido</button>
        <button class="cancelar" onclick="window.location.href='pedidos.html'">Cancelar</button>
    </main>
    <aside class="aside"></aside>
    <footer class="footer">
        <p>© 2026 viandas fit. Todos los derechos reservados.</p>
    </footer>

    <script src="js/pedidosNuevo.js"></script>
</body>
